name: novel-skills-main-sync

on:
  push:
    branches:
      - main
    paths:
      - "skills/novel-orchestrator-main/**"
      - "scripts/sync_novel_skills.py"
      - ".github/workflows/novel-skills-*.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync generated references
        run: python3 scripts/sync_novel_skills.py --write

      - name: Commit synced files
        run: |
          if [ -z "$(git status --porcelain -- skills/novel-bible-manager skills/novel-plot-architect skills/novel-scene-dramatizer skills/novel-dialogue-editor skills/novel-continuity-auditor skills/novel-chapter-summarizer)" ]; then
            echo "No synced changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/novel-bible-manager skills/novel-plot-architect skills/novel-scene-dramatizer skills/novel-dialogue-editor skills/novel-continuity-auditor skills/novel-chapter-summarizer
          git commit -m "chore: sync novel skill references"
          git push
